<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Achievement Tracker</title>
    <link rel="stylesheet" href="css/stylings.css">
    <script src="https://cdn.tailwindcss.com"> </script>
</head>

<body class="dashboard flex flex-col h-screen overflow-hidden">
    <!--Top Bar, purple one-->
    <div class="topBar p-2">
        <div class="grid grid-rows-1 gap-2 place-content-end">

            
            <div id="loggedOutControls">
                <button id="signInButton" class="accountButton">
                    Sign In
                </button>

                <button id="signUpButton" class="accountButton">
                    Sign Up
                </button>
            </div>
            
            <div id="loggedInControls" class="hidden">
                <span id="userEmail"></span>

                <button id="logoutButton" class="accountButton">
                    Log Out
                </button>
            </div>

        </div>
    </div>


    <!--Achievement Sections, green bars-->
    <div class="flex-1 min-h-0 p-5"> 
        <div class="dashboard h-full min-h-0 grid grid-cols-[1fr_2fr] grid-rows-[minmax(0,1fr)_auto] gap-10 p-5">


            <!--Section 1 Left Side-->
            <div class="card min-h-0">
                <div class="flex flex-col"> 
                    <div class="category flex-1 m-3 p-1">
                        <p class="pb-1">Personal</p>
                        <div class="progressContainer"> <div class="progressBar"></div></div>
                        <p class="pt-1">Achievement Completion: 10/10</p>
                    </div>
                    <div class="category flex-1 m-3 p-1">
                        <p class="pb-1">Work</p>
                        <div class="progressContainer"> <div class="progressBar"></div></div>
                        <p class="pt-1">Achievement Completion: 10/10</p>
                    </div>
                    <div class="category flex-1 m-3 p-1">
                        <p class="pb-1">School</p>
                        <div class="progressContainer"> <div class="progressBar"></div></div>
                        <p class="pt-1">Achievement Completion: 10/10</p>
                    </div>
                    <div class="category flex-1 m-3 p-1">
                        <p class="pb-1">Social</p>
                        <div class="progressContainer"> <div class="progressBar"></div></div>
                        <p class="pt-1">Achievement Completion: 10/10</p>
                    </div>
                    <div class="category flex-1 m-3 p-1">
                        <p class="pb-1">Financial</p>
                        <div class="progressContainer"> <div class="progressBar"></div></div>
                        <p class="pt-1">Achievement Completion: 10/10</p>
                    </div>
                </div>
            </div>

            <!--Section 2 Right Side-->
            <div class="card min-h-0">
                <div class="achievementList" id="achievementListJS">

                </div>
            </div>


            <!--Section 3 Bottom Bar-->
            <div class="card h-10 col-span-2 text-center">
                <button class="addAchievementButton" id="addAchievementButton"> Add Achievement</button>
            
            
            </div>
        </div>
    </div>

    <!--Popup for adding achievement-->
    
    <div id="achievementModal" class="modal hidden">

        <div class="modalWindow">

            <h2>New Achievement</h2>

            <label>Title</label>
            <input type="text" id="achievementTitle">

            <label>Description</label>
            <textarea id="achievementDescription"></textarea>

            <label>XP</label>
            <input type="number" id="achievementXP">

            <div>
                <button id="closeAchievementModal">Cancel</button>
                <button id="createAchievementButton">Create</button>
            </div>

        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/dash.js"></script>
</body>

</html>
