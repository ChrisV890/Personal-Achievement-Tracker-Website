<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Achievement Tracker</title>
    <link rel="stylesheet" href="css/stylings.css">
    <script src="https://cdn.tailwindcss.com"> </script>
</head>

<body class="dashboard flex flex-col h-screen overflow-hidden">
    <!--Top Bar, purple one-->
    <div class="topBar p-2 grid grid-cols-1">
        <div class="grid grid-rows-2 gap-2 place-content-end">
            <div class="bg-blue-500 p-1">1</div>
            <div class="bg-blue-500 p-1">2</div>
        </div>
    </div>

    <!--Achievement Sections, green bars-->
    <div class="flex-1 min-h-0 p-5"> 
        <div class="dashboard h-full min-h-0 grid grid-cols-[1fr_2fr] grid-rows-[minmax(0,1fr)_auto] gap-10 p-5">
            <div class="card min-h-0 text-center">
                1


            </div>

            <div class="card min-h-0 text-center">
                2
            
            
            </div>

            <div class="card h-10 col-span-2 text-center">
                3
            
            
            </div>
        </div>
    </div>






</body>
</html>
